<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System One Playground · Benchmark de decisiones sobre texto</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%236c4ee3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 1120px; margin: 0 auto; padding: clamp(16px, 4vw, 48px) clamp(16px, 3vw, 32px) 48px; }
    .topbar { max-width: 1120px; margin: 0 auto; }
    h1 { font-size: clamp(40px, 7vw, 76px); letter-spacing: -0.04em; margin-bottom: clamp(28px, 5vw, 48px); }
    /* Flex en vez de grid para que la última fila, incompleta, quede centrada. El tope de ancho
       mantiene las tarjetas del tamaño de la fila de arriba en lugar de estirarlas. */
    .demos { --hueco: clamp(16px, 3vw, 28px); display: flex; flex-wrap: wrap; justify-content: center; gap: var(--hueco); }
    .demo { flex: 1 1 300px; display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center; color: var(--ink); text-decoration: none; }
    @media (min-width: 640px) { .demo { max-width: calc((100% - var(--hueco)) / 2); } }
    @media (min-width: 1016px) { .demo { max-width: calc((100% - 2 * var(--hueco)) / 3); } }
    .demo svg { display: block; width: 100%; height: auto; border-radius: var(--radius-play);
      box-shadow: 0 6px 0 rgb(37 40 61 / .08); transition: transform .18s ease, box-shadow .18s ease; }
    .demo:hover svg { transform: translateY(-4px); box-shadow: 0 10px 0 rgb(37 40 61 / .08); }
    .demo h2 { font-size: 30px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><b>System One Playground</b></a>
    <p class="model" id="model" data-state="idle"><i aria-hidden="true"></i><span>Preparando modelo…</span></p>
  </header>
  <main>
    <h1>Mira decidir a los modelos</h1>
    <section class="demos">
      <a class="demo" href="/atlas">
        <h2>Atlas</h2>
        <svg viewBox="0 0 400 220" aria-hidden="true">
          <defs>
            <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="7" height="7" fill="#ede8de"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d6cfc1" stroke-width="3"/>
            </pattern>
          </defs>
          <rect width="400" height="220" fill="#64a8da"/>
          <g stroke="#fff" stroke-width="3" stroke-linejoin="round">
            <path d="M36,52 C62,30 128,28 150,50 C158,70 130,82 118,104 C104,120 84,116 76,104 C62,90 36,82 36,52Z" fill="#cfc1f9"/>
            <path d="M112,128 C128,124 140,142 136,164 C132,184 120,200 114,198 C108,182 100,146 112,128Z" fill="#7757e4"/>
            <path d="M190,48 C204,38 230,38 236,52 C232,66 212,70 198,68 C190,62 186,56 190,48Z" fill="url(#hatch)"/>
            <path d="M196,84 C222,76 244,88 244,112 C240,140 222,168 212,168 C200,152 188,118 196,84Z" fill="#a48cf1"/>
            <path d="M240,40 C284,26 350,34 370,54 C376,76 350,92 322,96 C296,100 268,88 254,80 C240,66 234,52 240,40Z" fill="#cfc1f9"/>
            <path d="M322,148 C342,140 364,148 362,164 C350,176 328,174 322,162Z" fill="#4428ae"/>
          </g>
        </svg>
        <span class="btn primary">Jugar</span>
      </a>
      <a class="demo" href="/city">
        <h2>City</h2>
        <svg viewBox="0 0 400 220" aria-hidden="true">
          <rect width="400" height="220" fill="#e9e3d6"/>
          <g>
            <rect x="34" y="30" width="34" height="34" rx="9" fill="#ffc53d"/><rect x="76" y="40" width="26" height="26" rx="8" fill="#3ddba8"/>
            <rect x="168" y="28" width="30" height="30" rx="9" fill="#4fa8f0"/><rect x="206" y="34" width="24" height="24" rx="7" fill="#ff6b5b"/>
            <circle cx="300" cy="46" r="15" fill="#8fd6a5"/><circle cx="332" cy="52" r="11" fill="#8fd6a5"/>
            <rect x="36" y="146" width="30" height="30" rx="9" fill="#4fa8f0"/><rect x="176" y="150" width="34" height="34" rx="9" fill="#ffc53d"/>
            <rect x="296" y="150" width="28" height="28" rx="8" fill="#3ddba8"/>

            <line x1="14" y1="110" x2="386" y2="110"/><line x1="130" y1="14" x2="130" y2="206"/><line x1="262" y1="14" x2="262" y2="206"/>
          </g>

          <circle cx="262" cy="188" r="12" fill="#ffc53d" stroke="#fff" stroke-width="4"/>
        </svg>
        <span class="btn primary">Jugar</span>
      </a>
      <a class="demo" href="/tickets">
        <h2>Mesa de ayuda</h2>
        <svg viewBox="0 0 400 220" aria-hidden="true">
          <rect width="400" height="220" fill="#efeafd"/>
          <g>
            <rect x="34" y="34" width="210" height="44" rx="14" fill="#fff"/><rect x="50" y="50" width="54" height="12" rx="6" fill="#cfc1f9"/><rect x="114" y="50" width="100" height="12" rx="6" fill="#e3e6ee"/><circle cx="226" cy="56" r="7" fill="#2fbf94"/>
            <rect x="34" y="88" width="210" height="44" rx="14" fill="#fff"/><rect x="50" y="104" width="54" height="12" rx="6" fill="#cfc1f9"/><rect x="114" y="104" width="80" height="12" rx="6" fill="#e3e6ee"/><circle cx="226" cy="110" r="7" fill="#ffc53d"/>
            <rect x="34" y="142" width="210" height="44" rx="14" fill="#fff"/><rect x="50" y="158" width="54" height="12" rx="6" fill="#cfc1f9"/><rect x="114" y="158" width="92" height="12" rx="6" fill="#e3e6ee"/><circle cx="226" cy="164" r="7" fill="#d8344a"/>
          </g>
          <rect x="296" y="46" width="52" height="128" rx="24" fill="#25283d"/>
          <circle cx="322" cy="78" r="15" fill="#3a3e56"/><circle cx="322" cy="110" r="15" fill="#3a3e56"/>
          <circle cx="322" cy="142" r="15" fill="#2fbf94"/>
        </svg>
        <span class="btn primary">Jugar</span>
      </a>
      <a class="demo" href="/courses">
        <h2>Ruta</h2>
        <svg viewBox="0 0 400 220" aria-hidden="true">
          <rect width="400" height="220" fill="#efeafd"/>
          <path d="M60,170 C120,170 120,110 180,110 C240,110 240,60 330,60" fill="none" stroke="#cfc1f9" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 20"/>
          <g>
            <rect x="30" y="140" width="62" height="62" rx="18" fill="#3ddba8"/><rect x="44" y="160" width="34" height="8" rx="4" fill="#fff"/><rect x="44" y="176" width="22" height="8" rx="4" fill="#fff" opacity=".7"/>
            <rect x="150" y="80" width="62" height="62" rx="18" fill="#4fa8f0"/><rect x="164" y="100" width="34" height="8" rx="4" fill="#fff"/><rect x="164" y="116" width="22" height="8" rx="4" fill="#fff" opacity=".7"/>
            <rect x="268" y="30" width="62" height="62" rx="18" fill="#7757e4"/><rect x="282" y="50" width="34" height="8" rx="4" fill="#fff"/><rect x="282" y="66" width="22" height="8" rx="4" fill="#fff" opacity=".7"/>
          </g>
          <g transform="translate(348 120)">
            <circle r="30" fill="#ffc53d"/>
            <path d="M-12,2 l8,9 l17,-19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <g fill="#25283d" opacity=".25">

          </g>
        </svg>
        <span class="btn primary">Jugar</span>
      </a>
      <a class="demo" href="/tools">
        <h2>Herramientas</h2>
        <svg viewBox="0 0 400 220" aria-hidden="true">
          <rect width="400" height="220" fill="#eef6f3"/>
          <rect x="30" y="26" width="150" height="26" rx="13" fill="#fff"/>
          <rect x="44" y="35" width="86" height="8" rx="4" fill="#cfc1f9"/>
          <path d="M105,60 L105,86 M105,86 L58,86 M105,86 L200,86 M105,86 L105,104" fill="none" stroke="#cfc1f9" stroke-width="4" stroke-linecap="round"/>
          <g>
            <rect x="24" y="96" width="68" height="34" rx="12" fill="#ffc53d"/><rect x="36" y="109" width="44" height="8" rx="4" fill="#fff" opacity=".9"/>
            <rect x="70" y="150" width="76" height="34" rx="12" fill="#2bb3bd"/><rect x="82" y="163" width="52" height="8" rx="4" fill="#fff" opacity=".9"/>
            <rect x="166" y="96" width="68" height="34" rx="12" fill="#7757e4"/><rect x="178" y="109" width="44" height="8" rx="4" fill="#fff" opacity=".9"/>
            <rect x="268" y="62" width="76" height="34" rx="12" fill="#e3e6ee"/><rect x="280" y="75" width="52" height="8" rx="4" fill="#fff"/>
            <rect x="286" y="150" width="76" height="34" rx="12" fill="#e3e6ee"/><rect x="298" y="163" width="52" height="8" rx="4" fill="#fff"/>
          </g>
          <path d="M92,113 L166,113" fill="none" stroke="#6c4ee3" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11"/>
          <path d="M108,150 L108,130" fill="none" stroke="#6c4ee3" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11"/>
          <circle cx="200" cy="113" r="9" fill="#6c4ee3"/>
          <path d="M196,113 l3,4 l7,-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="btn primary">Jugar</span>
      </a>
    </section>
  </main>
  <script type="module">
    import { watchModel } from "./common.js";
    watchModel(document.getElementById("model"));
  </script>
</body>
</html>
