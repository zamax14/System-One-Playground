<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas · System One Playground</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%236c4ee3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding: 0 clamp(16px, 3vw, 32px) 32px; }
    .ask { display: flex; gap: 12px; }
    .ask input {
      flex: 1; min-width: 0; height: 58px; padding: 0 22px; border-radius: 18px;
      border: 2px solid var(--line); background: var(--card); font-size: 19px; font-weight: 700;
    }
    .ask input::placeholder { color: var(--muted); font-weight: 600; }
    .ask input:focus-visible { outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft); }
    .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 18px; }
    .run-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
    .chip {
      border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
      background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; font-weight: 700; color: var(--ink-2);
    }
    .chip:hover { box-shadow: inset 0 0 0 2px var(--violet); color: var(--violet-deep); }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
    .map-card {
      position: relative; overflow: hidden; border-radius: var(--radius-play);
      background: radial-gradient(ellipse at 50% 40%, #6fb2e0, var(--ocean) 70%); height: max(440px, calc(100vh - 240px));
    }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
    #map.dragging { cursor: grabbing; }
    .graticule { fill: none; stroke: #fff; stroke-opacity: .16; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .country { stroke: #fff; stroke-width: .6; vector-effect: non-scaling-stroke; transition: fill .35s ease; }
    .country:hover { stroke: var(--ink); stroke-width: 1.6; }
    .country.selected { stroke: var(--ink); stroke-width: 2.4; }

    .tooltip {
      position: absolute; pointer-events: none; padding: 7px 12px; border-radius: 12px;
      background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap;
      transform: translate(-50%, calc(-100% - 14px));
    }
    .tooltip b { color: #cfc1f9; margin-left: 6px; }
    .legend, .zoom { position: absolute; bottom: 14px; background: var(--card); border-radius: 16px; padding: 10px 14px; }
    .legend { left: 14px; display: grid; grid-template-columns: auto auto; gap: 4px 18px; align-items: center; font-size: 12px; font-weight: 700; color: var(--ink-2); }
    .legend .ramp { width: 150px; height: 10px; border-radius: 5px; }
    .legend .ends { display: flex; justify-content: space-between; width: 150px; }
    .legend .none { display: flex; align-items: center; gap: 6px; grid-row: span 2; }
    .legend .none i { width: 18px; height: 18px; border-radius: 6px; border: 2px solid #fff;
      background: repeating-linear-gradient(45deg, var(--land) 0 3px, #d6cfc1 3px 5px); }
    .zoom { right: 14px; display: flex; gap: 6px; padding: 6px; }
    .zoom button { width: 36px; height: 36px; border: 0; border-radius: 12px; background: var(--bg); font-weight: 900; font-size: 18px; cursor: pointer; }


    .progress { height: 8px; border-radius: 4px; background: var(--line); margin: 14px 0 8px; overflow: hidden; }
    .progress div { height: 100%; width: 100%; background: var(--violet); border-radius: 4px; transform: scaleX(0); transform-origin: left; transition: transform .3s ease; }

    .side { display: grid; gap: 18px; }
    .detail h3 { font-size: 26px; }
    .detail .score { font-size: 44px; font-weight: 1000; letter-spacing: -0.03em; color: var(--violet-deep); line-height: 1; margin: 10px 0 2px; }
    .detail .texto { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--violet-soft);
      color: var(--ink-2); font-size: 14px; white-space: pre-line; }
    .ranking ol { list-style: none; margin: 0; padding: 0; max-height: max(260px, calc(100vh - 640px)); overflow: auto; counter-reset: rank; }
    .ranking li { counter-increment: rank; }
    .ranking button {
      width: 100%; display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px;
      padding: 6px 8px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; font-weight: 700;
    }
    .ranking button::before {
      content: counter(rank); display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
      color: var(--muted); font-size: 13px; font-weight: 900;
    }
    /* Medallas para el podio. */
    .ranking li:nth-child(1) button::before { background: #ffc53d; color: #6b4a00; }
    .ranking li:nth-child(2) button::before { background: #d5dae4; color: #454a5c; }
    .ranking li:nth-child(3) button::before { background: #f0b48a; color: #6e3b17; }
    .ranking button:hover, .ranking button[aria-current="true"] { background: var(--violet-soft); }
    .ranking .bar { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .ranking .bar i { display: block; height: 100%; border-radius: 3px; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .map-card { height: 58vh; }
      .ranking ol { max-height: 360px; }
    }
    @media (max-width: 560px) {
      .ask { flex-direction: column; }
      .ask input { flex: none; }
      /* En pantallas estrechas el mapa toma su proporción y los controles bajan debajo. */
      .map-card { height: auto; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10px; padding-bottom: 10px; }
      #map { grid-column: 1 / -1; height: auto; aspect-ratio: 2.2; }
      .legend, .zoom { position: static; }
      .legend { margin-left: 10px; grid-template-columns: auto; } .legend .none { grid-row: auto; }
      .zoom { margin-right: 10px; }
    }
    .api-note { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><b>System One Playground</b><span>Atlas</span></a>
    <p class="model" id="model" data-state="idle"><i aria-hidden="true"></i><span>Preparando modelo…</span></p>
  </header>
  <main>
    <form class="ask" id="ask">
      <label for="q" class="visually-hidden">Qué te apetece comer</label>
      <input id="q" autocomplete="off" maxlength="500" enterkeyhint="search" placeholder="¿Qué te apetece comer?">
    </form>
    <p class="api-note" id="api-note" hidden>Este modelo va por API: cada consulta son 176 llamadas a OpenRouter, 8 a la vez. Tarda más y tiene costo.</p>
    <div class="examples" id="examples">
      <button class="chip" type="button">Comida picante</button>
      <button class="chip" type="button">Mucho pescado y marisco</button>
      <button class="chip" type="button">Fácil para vegetarianos</button>
      <button class="chip" type="button">Platos con mucho arroz</button>
      <button class="chip" type="button">Donde se bebe buen café</button>
      <div class="run-tools">
        <span class="speed" id="speed" aria-live="polite" hidden></span>
        <span id="mode"></span>
      </div>
    </div>
    <div class="layout">
      <section class="map-card" aria-label="Mapa">
        <svg id="map" role="img" aria-label="Mapa del mundo coloreado según cuánto encaja la cocina de cada país"></svg>
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="legend" aria-label="Leyenda">
          <div class="ramp" id="ramp"></div>
          <div class="none"><i aria-hidden="true"></i>Sin evaluar</div>
          <div class="ends"><span>Poco</span><span>Mucho</span></div>
        </div>
        <div class="zoom">
          <button type="button" id="zoom-in" aria-label="Acercar">+</button>
          <button type="button" id="zoom-out" aria-label="Alejar">−</button>
          <button type="button" id="zoom-reset" aria-label="Ver todo el mapa">⤢</button>
        </div>
      </section>
      <aside class="side">
        <section class="panel detail" id="detail" aria-live="polite" hidden></section>
        <section class="panel ranking" id="ranking-panel" aria-label="Ranking" hidden>
          <ol id="ranking"></ol>
        </section>
      </aside>
    </div>
    <div class="progress" id="progress" aria-hidden="true" hidden><div id="bar"></div></div>
    <p class="status" id="status" aria-live="polite"></p>
  </main>
  <script type="module" src="atlas.js"></script>
</body>
</html>
